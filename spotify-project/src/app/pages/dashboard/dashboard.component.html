<main>
    <div class="header">
        <div class="logo">
            <img src="assets/spotify-logo.png" alt="Logo" width="40" height="40">
            <h2 id="welcome-message"></h2>
        </div>
        <button class="logout-btn" color="primary" (click)="logout()">Logout</button>
    </div>
    <div class="content">
        <h2>Your Numbers</h2>
        <div class="numbers">
            <div class="number-item">
                <h3>Top Artists</h3>
                <ol id="top-artists"></ol>
            </div>
            <div class="number-item">
                <h3>Top Tracks</h3>
                <ol id="top-tracks"></ol>
            </div>
            <div class="number-item">
                <h3>Top Genres</h3>
                <ol id="top-genres"></ol>
            </div>
        </div>
    </div>
</main>
